kind = "web"
previewPath = "/"
title = "Maryam Alghwari Trading Courses"
version = "1.0.0"
id = "artifacts/trading-courses"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23175

[services.development]
run = "pnpm --filter @workspace/trading-courses run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trading-courses", "run", "build" ]
publicDir = "artifacts/trading-courses/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23175"
BASE_PATH = "/"
